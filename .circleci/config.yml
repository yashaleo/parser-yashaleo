version: 2.1

executors:
  node-executor:
    docker:
      - image: cimg/node:18.18
    working_directory: ~/project

jobs:
  build:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: yarn install --frozen-lockfile
      - run:
          name: Build
          command: yarn build

  test:
    executor: node-executor
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: yarn install --frozen-lockfile
      - run:
          name: Lint
          command: yarn lint
      - run:
          name: Run unit tests
          command: yarn test
      - run:
          name: Test parser
          command: yarn test:parse
      - run:
          name: Test HTML
          command: yarn test:html

workflows:
  build_and_test:
    jobs:
      - build
      - test:
          requires:
            - build
